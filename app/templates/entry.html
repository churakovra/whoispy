{% extends "base.html" %}

{% block title %}Who'Spy?{% endblock %}

{% block styles %}
  <link rel="stylesheet" href="{{ url_for('static', path='css/entry.css') }}" />
{% endblock %}

{% block content %}
  <main class="entry-page">
    <section class="entry-card">
      <h1 class="entry-title" aria-label="Whoispy?">
        <span class="title-whois">Who'</span><span class="title-s" id="glitch-s">s</span><span class="title-spy">py?</span>
      </h1>
      <p class="entry-subtitle">Pick how you want to start</p>
      <div class="entry-actions">
        <a class="btn btn-create" href="/room">Create</a>
        <a class="btn btn-join" href="/room/join">Join</a>
      </div>
    </section>
  </main>
  <script src="{{ url_for('static', path='js/entry.js') }}"></script>
{% endblock %}
